server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Point d'entrée : toujours revalidé, sinon le navigateur garde une ancienne version
  # (sans en-tête, il applique un cache heuristique) qui pointe vers des assets disparus.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
