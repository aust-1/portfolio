name: Déploiement
# Déploie sur le VPS quand la CI de `main` est verte, et chaque nuit (le rebuild rafraîchit les
# stats GitHub, publiées vers 04:30 UTC par aust-1/github-stats, et le statut des rôles).
# Secrets requis (Settings → Secrets and variables → Actions) :
#   VPS_HOST, VPS_USER, VPS_PATH (ex. /opt/apps/portfolio : sous-module du dépôt opt)
#   VPS_SSH_KEY     clé privée dédiée au déploiement
#   VPS_KNOWN_HOSTS clé d'hôte du serveur, obtenue UNE fois depuis un réseau de confiance :
#                     ssh-keyscan -t ed25519 <ip-du-vps>
#                   (elle est épinglée : on ne fait jamais confiance à la première clé vue,
#                   ce qui permettrait à un intercepteur de se faire passer pour le serveur)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Déployer via SSH (clé d'hôte épinglée)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_KNOWN_HOSTS" || { echo "Secret VPS_KNOWN_HOSTS manquant" >&2; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=$HOME/.ssh/known_hosts \
            "$VPS_USER@$VPS_HOST" "cd '$VPS_PATH' && ./infra/deploy.sh"
