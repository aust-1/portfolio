name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Chaque nuit, après la publication des stats GitHub (04:30 UTC) : si la CI est verte, le
  # workflow Déploiement reconstruit le site (stats et statut des rôles à jour). Une CI rouge
  # ne déploie jamais.
  schedule:
    - cron: '30 5 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Qualité, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Sans variables FLAG_*, le build utilise des flags factices : aucun secret en CI.
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Aucun flag lisible dans le JavaScript livré
        run: '! grep -rE "aust-1\{dev_flag_[0-9]\}" build/_app'
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # L'image de production (Dockerfile + Caddyfile), testée comme sur le VPS : ce que vite preview
  # ne voit pas (en-têtes des 404, barre oblique finale, cache, types) est vérifié ici.
  image:
    name: Image Docker et Caddy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider le Caddyfile
        run: >-
          docker run --rm -e X_FLAG=ci -v "$PWD/infra/Caddyfile.site:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      # Sans arguments FLAG_*, le build utilise des flags factices : aucun secret en CI.
      - name: Construire l'image
        run: docker build -f infra/Dockerfile -t portfolio:ci .
      - name: Lancer le conteneur (mêmes restrictions que docker-compose.yml)
        run: >-
          docker run -d --name portfolio -p 8080:8080 -e 'X_FLAG=aust-1{dev_flag_2}'
          --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true
          portfolio:ci
      - name: Attendre le healthcheck
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' portfolio)"
            [ "$status" = healthy ] && exit 0
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          echo "Conteneur : $status" >&2
          docker logs portfolio
          exit 1
      - name: Vérifier les réponses
        run: infra/smoke.sh http://localhost:8080
      - name: Journaux du conteneur
        if: failure()
        run: docker logs portfolio
