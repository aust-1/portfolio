name: CI
on:
  push:
    branches: [main]
  pull_request:
  # Chaque nuit, après la publication des stats GitHub (04:30 UTC) : si la CI est verte, le
  # workflow Déploiement reconstruit le site (stats et statut des rôles à jour). Une CI rouge
  # ne déploie jamais.
  schedule:
    - cron: '30 5 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Qualité, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Sans variables FLAG_*, le build utilise des flags factices : aucun secret en CI.
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Aucun flag lisible dans le JavaScript livré
        run: '! grep -rE "aust-1\{dev_flag_[0-9]\}" build/_app'
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Tests de bout en bout
        run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
